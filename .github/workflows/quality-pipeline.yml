name: Quality Pipeline
on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-analysis:
    name: Análisis estático (ESLint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
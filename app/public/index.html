<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuevo proyecto</title>
  <style>
    :root { --fondo: #f4f5f7; --tinta: #1c1f22; --gris: #5f666d; --acento: #2f5bd3; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--fondo); color: var(--tinta); line-height: 1.5;
    }
    main { max-width: 560px; padding: 32px; text-align: center; }
    h1 { margin: 0 0 8px; font-size: 2rem; }
    p { margin: 0; color: var(--gris); }
    .estado { display: inline-block; margin-top: 24px; padding: 6px 12px; border-radius: 999px;
      background: #e3e9fb; color: var(--acento); font-weight: 600; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1 data-testid="titulo-app">Nuevo proyecto</h1>
    <p data-testid="descripcion-app">Proyecto creado con la plantilla DevSecOps con IA. Las funcionalidades llegan con cada historia de usuario.</p>
    <span class="estado" data-testid="estado-app">Listo para la primera historia</span>
  </main>
</body>
</html>

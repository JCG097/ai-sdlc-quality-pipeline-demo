name: Quality Pipeline
on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-analysis:
    name: Análisis estático (ESLint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
    
  unit-tests:
    name: Pruebas unitarias y cobertura (Jest)
    needs: static-analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/        